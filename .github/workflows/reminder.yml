name: AppReminder Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Bypass anti-bot & trigger cron (headless Chrome)
        run: node scripts/bypass-cron.js
        env:
          CRON_URL: ${{ secrets.CRON_TRIGGER_URL }}
